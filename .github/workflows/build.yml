name: Build
on:
  push:
    branches:
    - main
  workflow_dispatch:
  pull_request:
env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
      - name: Install dependencies
        run: npm ci
      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: false

  changes:
    runs-on: ubuntu-latest
    outputs:
      cdk: ${{ steps.filter.outputs.cdk }}
      agent_core: ${{ steps.filter.outputs.agent_core }}
      slack_bolt_app: ${{ steps.filter.outputs.slack_bolt_app }}
      worker: ${{ steps.filter.outputs.worker }}
      webapp: ${{ steps.filter.outputs.webapp }}
      github_actions: ${{ steps.filter.outputs.github_actions }}
      dockerfiles: ${{ steps.filter.outputs.dockerfiles }}
      microvm_preview_proxy: ${{ steps.filter.outputs.microvm_preview_proxy }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Filter changed files
        id: filter
        shell: bash
        run: |
          # Determine base and head for comparison
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          else
            # For workflow_dispatch, compare against the previous commit
            base="HEAD~1"
            head="HEAD"
          fi

          # Function to check if any file matches the patterns
          check_changes() {
            local patterns="$1"
            for pattern in $patterns; do
              if git diff --name-only "$base" "$head" | grep -qE "^${pattern}"; then
                echo "true"
                return 0
              fi
            done
            echo "false"
            return 0
          }

          # Check each path filter
          cdk=$(check_changes "cdk/")
          echo "cdk=$cdk" >> "$GITHUB_OUTPUT"
          echo "cdk=$cdk"

          agent_core=$(check_changes "packages/agent-core/ package\.json package-lock\.json")
          echo "agent_core=$agent_core" >> "$GITHUB_OUTPUT"
          echo "agent_core=$agent_core"

          slack_bolt_app=$(check_changes "packages/slack-bolt-app/ packages/agent-core/ package\.json package-lock\.json")
          echo "slack_bolt_app=$slack_bolt_app" >> "$GITHUB_OUTPUT"
          echo "slack_bolt_app=$slack_bolt_app"

          worker=$(check_changes "packages/worker/ packages/agent-core/ package\.json package-lock\.json")
          echo "worker=$worker" >> "$GITHUB_OUTPUT"
          echo "worker=$worker"

          webapp=$(check_changes "packages/webapp/ packages/agent-core/ package\.json package-lock\.json")
          echo "webapp=$webapp" >> "$GITHUB_OUTPUT"
          echo "webapp=$webapp"

          github_actions=$(check_changes "packages/github-actions/ packages/agent-core/ package\.json package-lock\.json")
          echo "github_actions=$github_actions" >> "$GITHUB_OUTPUT"
          echo "github_actions=$github_actions"

          dockerfiles=$(check_changes "docker/")
          echo "dockerfiles=$dockerfiles" >> "$GITHUB_OUTPUT"
          echo "dockerfiles=$dockerfiles"

          microvm_preview_proxy=$(check_changes "packages/microvm-preview-proxy/ package\.json package-lock\.json")
          echo "microvm_preview_proxy=$microvm_preview_proxy" >> "$GITHUB_OUTPUT"
          echo "microvm_preview_proxy=$microvm_preview_proxy"
  Build-and-Test-CDK:
    needs: changes
    if: ${{ needs.changes.outputs.cdk == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
      - run: |
          npm ci
          npm run build
          npm run format:check
        working-directory: ./cdk
        name: Run static analyses
      - run: |
          npm run test
        working-directory: ./cdk
        name: Run snapshot test
      - run: |
          npx cdk synth
        working-directory: ./cdk
        name: Run cdk cli
  Build-and-Test-Slack-Bolt-App:
    needs: changes
    if: ${{ needs.changes.outputs.slack_bolt_app == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
      - name: Install dependencies
        run: |
          npm ci
          npm run build -w packages/agent-core
      - name: Run static analyses
        run: npm run format:check -w packages/slack-bolt-app
      - name: Run build
        run: npm run build -w packages/slack-bolt-app
  Build-and-Test-Worker:
    needs: changes
    if: ${{ needs.changes.outputs.worker == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
      - name: Install dependencies
        run: |
          npm ci
          npm run build -w packages/agent-core
      - name: Run static analyses
        run: npm run format:check -w packages/worker
      - name: Run unit tests
        run: npm run test -w packages/worker
      - name: Run build
        run: npm run build -w packages/worker
  Build-and-Test-Webapp:
    needs: changes
    if: ${{ needs.changes.outputs.webapp == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
      - name: Install dependencies
        run: |
          npm ci
          npm run build -w packages/agent-core
      - name: Run static analyses
        run: npm run format:check -w packages/webapp
      - name: Run build
        run: |
          cp packages/webapp/.env.local.example packages/webapp/.env.local
          npm run build -w packages/webapp
  Build-and-Test-AgentCore:
    needs: changes
    if: ${{ needs.changes.outputs.agent_core == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
      - name: Install dependencies
        run: npm ci
      - name: Run static analyses
        run: npm run format:check -w packages/agent-core
      - name: Run unit tests
        run: npm run test -w packages/agent-core
      - name: Run build
        run: npm run build -w packages/agent-core
  Build-and-Test-GitHubActions:
    needs: changes
    if: ${{ needs.changes.outputs.github_actions == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
      - name: Install dependencies
        run: |
          npm ci
          npm run build -w packages/agent-core
      - name: Run static analyses
        run: npm run format:check -w packages/github-actions
      - name: Run build
        run: npm run build -w packages/github-actions
  Type-Check-Packages:
    needs: changes
    if: ${{ needs.changes.outputs.agent_core == 'true' || needs.changes.outputs.worker == 'true' || needs.changes.outputs.webapp == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
      - name: Install dependencies
        run: npm ci
      # Type-check all packages that have TypeScript build scripts
      # This catches type errors before Docker builds fail silently
      # Note: agent-core must always be built before worker since worker depends on it
      - name: Type-check agent-core
        if: ${{ needs.changes.outputs.agent_core == 'true' || needs.changes.outputs.worker == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        run: npm run build -w packages/agent-core
      - name: Type-check worker
        if: ${{ needs.changes.outputs.worker == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        run: npm run build -w packages/worker

  Build-and-Test-Dockerfiles:
    needs: [changes, Type-Check-Packages]
    if: ${{ needs.changes.outputs.dockerfiles == 'true' || needs.changes.outputs.slack_bolt_app == 'true' || needs.changes.outputs.webapp == 'true' || needs.changes.outputs.agent_core == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build slack-bolt-app docker image
        run: docker build -f docker/slack-bolt-app.Dockerfile -t slack-bolt-app .

      - name: Test slack-bolt-app image boots successfully
        run: docker run --entrypoint node --env TESTING_BOOTSTRAP=true --env BOT_TOKEN=dummy --env SIGNING_SECRET=dummy slack-bolt-app local.js

      - name: Build webapp docker image
        run: docker build -f docker/webapp.Dockerfile -t webapp .

      - name: Test webapp run.sh works in container
        run: |
          echo "=== Testing webapp/run.sh in Lambda container ==="
          # Copy packages/webapp/run.sh to a temp location for testing
          cp packages/webapp/run.sh /tmp/test-run.sh

          # Create a simple Node.js script that acts as the Lambda handler
          cat > /tmp/dummy-handler.js << 'EOF'
          exports.handler = async () => {
            return { statusCode: 200, body: 'OK' };
          };
          EOF

          # Test run.sh by mounting it into Lambda container with our test setup
          # We override the entrypoint to run bash and test the script
          docker run --rm \
            -v /tmp/test-run.sh:/var/task/run.sh:ro \
            -v /tmp/dummy-handler.js:/var/task/dummy-handler.js:ro \
            -w /var/task \
            --entrypoint bash \
            public.ecr.aws/lambda/nodejs:24 \
            -c '
              export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

              # Test that run.sh exists and is readable
              if [ ! -r /var/task/run.sh ]; then
                echo "ERROR: run.sh not found or not readable"
                exit 1
              fi
              echo "✓ run.sh readable"

              # Validate syntax
              bash -n /var/task/run.sh || { echo "ERROR: run.sh has syntax errors"; exit 1; }
              echo "✓ run.sh syntax valid"

              # Test node binary lookup logic (same as run.sh)
              NODE_BIN=""
              for path in "/usr/bin/node" "/usr/local/bin/node"; do
                if [ -x "$path" ]; then
                  NODE_BIN="$path"
                  break
                fi
              done
              if [ -z "$NODE_BIN" ]; then
                NODE_BIN=$(command -v node 2>/dev/null || true)
              fi
              if [ -z "$NODE_BIN" ] || [ ! -x "$NODE_BIN" ]; then
                echo "ERROR: Node binary not found"
                exit 1
              fi
              echo "✓ Node binary found at: $NODE_BIN"
              echo "✓ Node version: $($NODE_BIN --version)"
            '

          echo "✓ run.sh works correctly in Lambda container"

      - name: Validate run.sh uses POSIX-compliant commands
        run: |
          echo "=== Checking for non-POSIX commands in run.sh files ==="

          # Check for 'which' command which is not available in Lambda runtime
          if grep -q "which" packages/webapp/run.sh; then
            echo "ERROR: packages/webapp/run.sh uses 'which' which is not available in Lambda runtime" >&2
            exit 1
          fi
          if grep -q "which" packages/worker/run.sh; then
            echo "ERROR: packages/worker/run.sh uses 'which' which is not available in Lambda runtime" >&2
            exit 1
          fi

          # Check for 'stat' command with -c flag which may not be available
          if grep -q "stat -c" packages/webapp/run.sh; then
            echo "ERROR: packages/webapp/run.sh uses 'stat -c' which is not portable" >&2
            exit 1
          fi
          if grep -q "stat -c" packages/worker/run.sh; then
            echo "ERROR: packages/worker/run.sh uses 'stat -c' which is not portable" >&2
            exit 1
          fi

          echo "✓ run.sh scripts use POSIX-compliant commands"
  Build-and-Test-MicrovmPreviewProxy:
    needs: changes
    if: ${{ needs.changes.outputs.microvm_preview_proxy == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build microvm-preview-proxy docker image
        run: docker build -f packages/microvm-preview-proxy/Dockerfile -t microvm-preview-proxy ./packages/microvm-preview-proxy
      - name: Test if the image can boot successfully
        run: docker run --entrypoint node microvm-preview-proxy -e "console.log('Docker image boot test passed')" || true

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read # This is required for actions/checkout

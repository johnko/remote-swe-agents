name: Dependency Review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          # Fail on moderate or higher severity vulnerabilities
          fail-on-severity: moderate
          # Allow specific licenses (optional)
          allow-licenses: MIT, Apache-2.0, BSD-3-Clause, BSD-2-Clause, ISC
          # Allow specific packages with incompatible licenses (transitive dependencies)
          allow-dependencies-licenses: pkg:npm/caniuse-lite@1.0.30001826, pkg:npm/graceful-fs@4.2.12
          # Ignore specific vulnerabilities if needed (use advisories URL)
          # deny-packages: package-name@version
          # Show openssf scorecard scores
          show-openssf-scorecard: true
          # Comment on PR with summary
          comment-summary-in-pr: never
